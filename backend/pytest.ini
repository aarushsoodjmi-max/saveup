[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    # Third-party deprecation noise we don't control the timing of a
    # fix for (Starlette's TestClient / httpx's ASGITransport
    # migration). Scoped to warnings *raised from* these packages only
    # -- warnings raised from our own app/tests code are untouched, so
    # this can't hide a real issue in this project.
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:httpx
